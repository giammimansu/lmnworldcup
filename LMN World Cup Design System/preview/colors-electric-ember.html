<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--lmn-midnight-500);color:var(--lmn-ash-100);font-family:var(--lmn-font-ui);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--lmn-ash-800);min-width:78px;flex:1}
.sw .c{height:42px}.sw .m{padding:6px 8px;background:var(--lmn-pitch-600)}
.tok{font-family:var(--lmn-font-mono);font-size:9.5px;color:var(--lmn-ash-500)}
.k{font-family:var(--lmn-font-display);font-size:14px;color:var(--lmn-ash-200);letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:9999px;line-height:1}
.btn{font-weight:600;border:1px solid transparent;border-radius:8px;display:inline-flex;align-items:center;gap:8px;cursor:default;font-size:14px;padding:9px 18px;font-family:var(--lmn-font-ui)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lmn-danger-500)}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div class="tok" style="color:var(--lmn-electric-300);font-size:11px">ELECTRIC — live · info</div>
<div class="row"><div class="sw"><div class="c" style="background:#D6E6FF"></div><div class="m"><div class="k">100</div><div class="tok">#D6E6FF</div></div></div><div class="sw"><div class="c" style="background:#6FA8FF"></div><div class="m"><div class="k">300</div><div class="tok">#6FA8FF</div></div></div><div class="sw"><div class="c" style="background:#1E6BF0"></div><div class="m"><div class="k">500</div><div class="tok">#1E6BF0</div></div></div><div class="sw"><div class="c" style="background:#103F95"></div><div class="m"><div class="k">700</div><div class="tok">#103F95</div></div></div><div class="sw"><div class="c" style="background:#071B3F"></div><div class="m"><div class="k">900</div><div class="tok">#071B3F</div></div></div></div>
<div class="tok" style="color:var(--lmn-ember-300);font-size:11px;margin-top:4px">EMBER — warning · in-progress</div>
<div class="row"><div class="sw"><div class="c" style="background:#FDE4CE"></div><div class="m"><div class="k">100</div><div class="tok">#FDE4CE</div></div></div><div class="sw"><div class="c" style="background:#F6A465"></div><div class="m"><div class="k">300</div><div class="tok">#F6A465</div></div></div><div class="sw"><div class="c" style="background:#E96D1C"></div><div class="m"><div class="k">500</div><div class="tok">#E96D1C</div></div></div><div class="sw"><div class="c" style="background:#97400B"></div><div class="m"><div class="k">700</div><div class="tok">#97400B</div></div></div><div class="sw"><div class="c" style="background:#3F1B05"></div><div class="m"><div class="k">900</div><div class="tok">#3F1B05</div></div></div></div>
</div></body></html>
