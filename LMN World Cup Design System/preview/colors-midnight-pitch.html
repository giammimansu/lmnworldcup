<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--lmn-midnight-500);color:var(--lmn-ash-100);font-family:var(--lmn-font-ui);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--lmn-ash-800);min-width:78px;flex:1}
.sw .c{height:42px}.sw .m{padding:6px 8px;background:var(--lmn-pitch-600)}
.tok{font-family:var(--lmn-font-mono);font-size:9.5px;color:var(--lmn-ash-500)}
.k{font-family:var(--lmn-font-display);font-size:14px;color:var(--lmn-ash-200);letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:9999px;line-height:1}
.btn{font-weight:600;border:1px solid transparent;border-radius:8px;display:inline-flex;align-items:center;gap:8px;cursor:default;font-size:14px;padding:9px 18px;font-family:var(--lmn-font-ui)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lmn-danger-500)}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div class="tok" style="color:var(--lmn-ash-400);font-size:11px">MIDNIGHT — backgrounds</div>
<div class="row"><div class="sw"><div class="c" style="background:#2A3654"></div><div class="m"><div class="k">100</div><div class="tok">#2A3654</div></div></div><div class="sw"><div class="c" style="background:#1B2440"></div><div class="m"><div class="k">300</div><div class="tok">#1B2440</div></div></div><div class="sw"><div class="c" style="background:#10172A"></div><div class="m"><div class="k">500</div><div class="tok">#10172A</div></div></div><div class="sw"><div class="c" style="background:#090E1B"></div><div class="m"><div class="k">700</div><div class="tok">#090E1B</div></div></div><div class="sw"><div class="c" style="background:#03060D"></div><div class="m"><div class="k">900</div><div class="tok">#03060D</div></div></div></div>
<div class="tok" style="color:var(--lmn-ash-400);font-size:11px;margin-top:4px">PITCH — surfaces</div>
<div class="row"><div class="sw"><div class="c" style="background:#2E3A57"></div><div class="m"><div class="k">100</div><div class="tok">#2E3A57</div></div></div><div class="sw"><div class="c" style="background:#222C46"></div><div class="m"><div class="k">300</div><div class="tok">#222C46</div></div></div><div class="sw"><div class="c" style="background:#182038"></div><div class="m"><div class="k">500</div><div class="tok">#182038</div></div></div><div class="sw"><div class="c" style="background:#111728"></div><div class="m"><div class="k">700</div><div class="tok">#111728</div></div></div><div class="sw"><div class="c" style="background:#090D17"></div><div class="m"><div class="k">900</div><div class="tok">#090D17</div></div></div></div>
</div></body></html>
